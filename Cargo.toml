[package]
name = "f3-starter"
version = "0.1.0"
edition = "2024"

[dependencies]
# Enable single-core interrupt masking for critical sections
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Logging and RTT transport
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Hardware Abstraction Layer
stm32f3xx-hal = { version = "0.10", features = ["stm32f303xc", "rt"] }

[profile.dev]
opt-level = 1
lto = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
